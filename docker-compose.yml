services:
  postgres:
    image: postgres:16-alpine
    container_name: flowmint-postgres
    environment:
      POSTGRES_USER: flowmint
      POSTGRES_PASSWORD: flowmint_dev
      POSTGRES_DB: flowmint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmint -d flowmint_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowmint-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
