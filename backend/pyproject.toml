[project]
name = "flowmint-ai-backend"
version = "0.1.0"
description = "Flowmint AI — Bounded-autonomy revenue operating system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
